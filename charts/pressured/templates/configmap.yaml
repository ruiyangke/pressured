{{- /* config.json is built as a dict and serialized, so it is always valid JSON */ -}}
{{- $v := .Values -}}
{{- $cluster := eq $v.mode "cluster" -}}

{{- $kubelet := dict -}}
{{- with $v.config.source.kubelet.namespace_filter }}{{ $_ := set $kubelet "namespace_filter" . }}{{ end -}}
{{- with $v.config.source.kubelet.label_selector }}{{ $_ := set $kubelet "label_selector" . }}{{ end -}}
{{- $source := dict
      "mode" (ternary "kubelet" "cgroup" $cluster)
      "poll_interval_ms" (ternary $v.config.source.kubelet.poll_interval_ms $v.config.source.cgroup.poll_interval_ms $cluster)
      "cgroup" (dict "path" $v.config.source.cgroup.path)
      "kubelet" $kubelet -}}

{{- $config := dict
      "source" $source
      "thresholds" $v.config.thresholds
      "dry_run" $v.config.dry_run
      "log_level" $v.config.log_level -}}

{{- if $v.storage.enabled }}
{{- $backend := $v.storage.backend -}}
{{- $storage := dict "backend" $backend -}}
{{- if eq $backend "local" }}
{{- $_ := set $storage "local" (dict "path" $v.storage.local.path) -}}
{{- else if eq $backend "s3" }}
{{- $s3 := dict "bucket" $v.storage.s3.bucket "prefix" $v.storage.s3.prefix "region" $v.storage.s3.region -}}
{{- with $v.storage.s3.endpoint }}{{ $_ := set $s3 "endpoint" . }}{{ end -}}
{{- $_ := set $storage "s3" $s3 -}}
{{- else if eq $backend "gcs" }}
{{- $_ := set $storage "gcs" (dict "bucket" $v.storage.gcs.bucket "prefix" $v.storage.gcs.prefix) -}}
{{- else if eq $backend "azure" }}
{{- $_ := set $storage "azure" (dict "container" $v.storage.azure.container "prefix" $v.storage.azure.prefix "storage_account" $v.storage.azure.storageAccount) -}}
{{- end }}
{{- $_ := set $config "storage" $storage -}}
{{- end }}

{{- $plugins := dict -}}
{{- if $v.lua.enabled }}
{{- $lua := dict -}}
{{- if $v.lua.inlineScript }}
{{- $_ := set $lua "inline_script" $v.lua.inlineScript -}}
{{- else if or $v.lua.scripts $v.lua.existingConfigMap }}
{{- $_ := set $lua "scripts_dir" $v.lua.scriptsDir -}}
{{- end }}
{{- with $v.lua.timeoutMs }}{{ $_ := set $lua "timeout_ms" . }}{{ end -}}
{{- with $v.lua.slack }}
{{- $slack := dict -}}
{{- with .channels }}{{ $_ := set $slack "channels" . }}{{ end -}}
{{- with .username }}{{ $_ := set $slack "username" . }}{{ end -}}
{{- with .template }}{{ $_ := set $slack "template" . }}{{ end -}}
{{- with .apiBase }}{{ $_ := set $slack "api_base" . }}{{ end -}}
{{- if hasKey . "remindSeconds" }}{{ $_ := set $slack "remind_seconds" .remindSeconds }}{{ end -}}
{{- if $slack }}{{ $_ := set $lua "slack" $slack }}{{ end -}}
{{- end }}
{{- $_ := set $plugins "lua" $lua -}}
{{- end }}
{{- if and $v.storage.enabled (ne $v.storage.backend "local") }}
{{- /* Only one storage backend: keep the local one out of the way */ -}}
{{- $_ := set $plugins "local-storage" (dict "enabled" false) -}}
{{- end }}
{{- if $plugins }}{{ $_ := set $config "plugins" $plugins }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pressured.fullname" . }}
  labels:
    {{- include "pressured.labels" . | nindent 4 }}
data:
  config.json: |
    {{- toPrettyJson $config | nindent 4 }}
